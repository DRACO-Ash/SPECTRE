[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sipc"
version = "0.1.0"
description = "STK Intercept Planning Console — rapid intercept replanning via AGI STK COM automation"
readme = "README.md"
license = { text = "Proprietary" }
requires-python = ">=3.14"
dependencies = [
    "pywin32>=311",
    "structlog>=25.0",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1",
    "python-multipart",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite",
    "bcrypt>=4.0",
    "itsdangerous>=2.1",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.23",
    "anyio[trio]>=4.0",
    "httpx>=0.27",
    "pytest-cov>=6.0",
    "mypy>=1.14",
    "ruff>=0.9",
]

[project.scripts]
sipc-serve = "sipc.web._entrypoint:main"

# ---------------------------------------------------------------------------
# Hatch
# ---------------------------------------------------------------------------
[tool.hatch.build.targets.wheel]
packages = ["sipc"]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

# ---------------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.14"
strict = true
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: marks tests requiring a live STK COM connection (deselect with -m 'not integration')",
]
addopts = "-ra -q"
asyncio_mode = "auto"

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["sipc"]
omit = ["tests/*", "sipc/stk_adapter/com_session.py", "sipc/app_logging/setup.py"]

[tool.coverage.report]
fail_under = 70
show_missing = true
