[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sipc"
version = "0.1.0"
description = "STK Intercept Planning Console — rapid intercept replanning via AGI STK COM automation"
readme = "README.md"
license = { text = "Proprietary" }
requires-python = ">=3.14"
dependencies = [
    "PySide6>=6.8",
    "pywin32>=311",
    "structlog>=25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-qt>=4.4",
    "pytest-cov>=6.0",
    "mypy>=1.14",
    "ruff>=0.9",
]
build = [
    "pyinstaller>=6.12",
]

[project.scripts]
sipc = "sipc.ui.app:main"

# ---------------------------------------------------------------------------
# Hatch
# ---------------------------------------------------------------------------
[tool.hatch.build.targets.wheel]
packages = ["sipc"]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]
ignore = ["ANN101", "ANN102"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

# ---------------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.14"
strict = true
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: marks tests requiring a live STK COM connection (deselect with -m 'not integration')",
]
addopts = "-ra -q"

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["sipc"]
omit = ["sipc/ui/*", "tests/*"]

[tool.coverage.report]
fail_under = 70
show_missing = true
