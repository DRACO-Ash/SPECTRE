[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spectre"
version = "0.1.0"
description = "Space Planning, Evaluation & Counter-Threat Response Engine — orbital mechanics, threat assessment, and manoeuvre planning"
readme = "README.md"
license = { text = "Proprietary" }
requires-python = ">=3.14"
dependencies = [
    "structlog>=25.0",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1",
    "python-multipart",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite",
    "bcrypt>=4.0",
    "itsdangerous>=2.1",
    "httpx>=0.27",
    "sgp4>=2.22",
    "numpy>=2.0",
    "python-dotenv>=1.0",
    "python-docx>=1.1",
    "pandas>=2.0",
    "scipy>=1.11",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.23",
    "anyio[trio]>=4.0",
    "httpx>=0.27",
    "pytest-cov>=6.0",
    "mypy>=1.14",
    "ruff>=0.9",
    "hypothesis>=6.0",
    "bandit[toml]>=1.7",
    "pip-audit>=2.7",
]

[project.scripts]
spectre-serve = "spectre.web._entrypoint:main"

# ---------------------------------------------------------------------------
# Hatch
# ---------------------------------------------------------------------------
[tool.hatch.build.targets.wheel]
packages = ["spectre"]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "B008",   # FastAPI Depends() in default args — intentional pattern
    "E501",   # line too long — enforced by line-length setting above
    "SIM108", # ternary over if/else — readability preference
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]
"docs/**"  = ["ALL"]

# ---------------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.14"
strict = true
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Bandit
# ---------------------------------------------------------------------------
[tool.bandit]
targets = ["spectre"]
severity = "medium"   # gate on medium+; high+ will always block
confidence = "medium"
exclude_dirs = ["tests", ".venv"]

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: marks tests requiring a live network connection (deselect with -m 'not integration')",
]
addopts = "-ra -q"
asyncio_mode = "auto"

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["spectre"]
omit = ["tests/*", "spectre/app_logging/setup.py"]

[tool.coverage.report]
fail_under = 70
show_missing = true
