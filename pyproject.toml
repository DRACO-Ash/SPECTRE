# Shaped to the App Store gate contract.
#
# The Dependency Scanning analyser treats a non-Poetry pyproject.toml as a
# resolution trigger: it feeds a pip-compile run whose output is what actually
# gets scanned. Both applications known to clear the gate ship a [project]
# table and NO [project.dependencies]. Dependencies live in the pip-compile
# inputs and their hash-locked outputs, which is what the platform Test stage
# and the image actually install. Declaring them here as well lets the two
# drift, and drift is what the gate punishes.
#
# A pyproject.toml carrying only [build-system] and no [project] table is
# skipped with a warning, so the [project] table below is load-bearing.
#
# The version is rewritten by scripts/bump-version.sh. Never edit it by hand.

# The build backend is declared explicitly, and so are the packages.
#
# Without [build-system], PEP 517 defaults to setuptools. Any resolver that
# reads this file calls the build hook to get requirements, and setuptools
# flat-layout auto-discovery then sees TWO importable top-level directories and
# refuses outright:
#
#     error: Multiple top-level packages discovered in a flat-layout:
#            ['spectre', 'tle_clustering']
#
# That is a hard, immediate failure with the message on stderr. It is the most
# likely explanation for a Dependency Scanning job that exits 1 after a few
# seconds with no SBOM and no error text, and it is reproduced by
# `pip install --dry-run --no-deps .` against the package root.
#
# PSIRENS, which clears this gate, has a single package under src/, so its
# auto-discovery is unambiguous. Declaring the packages here achieves the same
# certainty without restructuring the repository.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["spectre*", "tle_clustering*"]
namespaces = false

[project]
name = "spectre"
version = "0.5.5"
description = "Space Planning, Evaluation and Counter-Threat Response Engine: orbital mechanics, threat assessment, and manoeuvre planning."
requires-python = ">=3.12"

# ---------------------------------------------------------------------------
# Pytest and coverage
#
# Held here rather than in pytest.ini and .coveragerc so the package root
# carries no file the analyser has no reason to see. PSIRENS, which clears this
# gate, ships seven files at its root and neither of those is among them.
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: marks tests requiring a live network connection (deselect with -m 'not integration')",
]
addopts = "-ra -q"
asyncio_mode = "auto"

[tool.coverage.run]
source = ["spectre", "tle_clustering"]
# SQLAlchemy's async bridge switches greenlets on every await. Without this,
# coverage loses the trace after `await session.execute(...)` and under-reports
# lines that demonstrably run, which would understate coverage to SonarQube.
concurrency = ["thread", "greenlet"]
omit = ["tests/*", "spectre/app_logging/config.py"]

[tool.coverage.report]
fail_under = 70
show_missing = true

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "B008",   # FastAPI Depends() in default args — intentional pattern
    "E501",   # line too long — enforced by line-length setting above
    "SIM108", # ternary over if/else — readability preference
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]
"docs/**"  = ["ALL"]

# ---------------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
# FastAPI's APIRouter.get/post decorators are not fully typed in strict mode
disable_error_code = ["untyped-decorator"]

# ---------------------------------------------------------------------------
# Bandit
# ---------------------------------------------------------------------------
[tool.bandit]
targets = ["spectre"]
severity = "medium"   # gate on medium+; high+ will always block
confidence = "medium"
exclude_dirs = ["tests", ".venv"]
