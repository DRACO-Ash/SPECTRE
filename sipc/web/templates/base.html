<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}SIPC{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
  <link rel="stylesheet" href="/static/style.css" />
  <script src="/static/htmx.min.js"></script>
  <script src="/static/chart.umd.min.js"
          onerror="this.onerror=null;this.src='https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js'"></script>
  <script src="/static/hammer.min.js"
          onerror="this.onerror=null;this.src='https://cdn.jsdelivr.net/npm/hammerjs@2.0.8/hammer.min.js'"></script>
  <script src="/static/chartjs-plugin-zoom.min.js"
          onerror="this.onerror=null;this.src='https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1/dist/chartjs-plugin-zoom.min.js'"></script>
</head>
<body>
  <!-- Bluestaq four-segment accent bar -->
  <div class="accent-bar">
    <div class="accent-bar-navy"></div>
    <div class="accent-bar-blue"></div>
    <div class="accent-bar-mid"></div>
    <div class="accent-bar-gold"></div>
  </div>

  <nav class="nav-bar">
    <div class="nav-brand">
      {% block nav_brand %}{% endblock %}
    </div>
    {% block nav_actions %}{% endblock %}
  </nav>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
