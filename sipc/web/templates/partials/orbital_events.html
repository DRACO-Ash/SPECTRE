{% if error %}
<p class="error-msg">{{ error }}</p>
{% elif not events %}
<p class="empty-msg">No orbital events found for this satellite.</p>
{% else %}
<div class="orbital-events-list">
  <span class="label-dim">Click an event to set the manoeuvre start time:</span>
  {% for ev in events %}
  <button type="button" class="btn-sm btn-event btn-event-{{ ev.event_type.value }}"
          title="{{ ev.label }}"
          onclick="document.querySelector('#intercept-engine-form [name=manoeuvre_start]').value='{{ ev.epoch.strftime('%Y-%m-%dT%H:%M:%S') }}'">
    {{ ev.event_type.value | replace("_"," ") | title }} &mdash; {{ ev.epoch.strftime('%d %b %H:%M UTC') }}
  </button>
  {% endfor %}
</div>
{% endif %}
