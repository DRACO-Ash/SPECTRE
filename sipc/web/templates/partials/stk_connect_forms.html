<div class="stk-connect-tabs">

  <fieldset class="stk-tab">
    <legend>Attach to running instance</legend>
    <p class="stk-hint">STK must already be open with a scenario loaded.</p>
    <form hx-post="/stk/connect"
          hx-target="#stk-status"
          hx-swap="innerHTML"
          class="stk-form">
      <input name="scenario_path" value="" type="hidden" />
      <button type="submit" class="btn-primary btn-sm">Attach</button>
    </form>
  </fieldset>

  <fieldset class="stk-tab">
    <legend>Load existing scenario</legend>
    <form hx-post="/stk/connect"
          hx-target="#stk-status"
          hx-swap="innerHTML"
          class="stk-form">
      <input name="scenario_path"
             placeholder="Full path to .sc file"
             required
             class="stk-path-input" />
      <button type="submit" class="btn-primary btn-sm">Load</button>
    </form>
  </fieldset>

  <fieldset class="stk-tab">
    <legend>Create new scenario</legend>
    <form hx-post="/stk/new"
          hx-target="#stk-status"
          hx-swap="innerHTML"
          class="stk-form">
      <input name="scenario_name"
             placeholder="Scenario name (e.g. SIPC_Run_001)"
             required
             class="stk-path-input" />
      <label class="stk-time-label">Start (UTC)
        <input type="datetime-local" name="scenario_start" id="sc-start" required class="stk-path-input" />
      </label>
      <label class="stk-time-label">Stop (UTC)
        <input type="datetime-local" name="scenario_stop" id="sc-stop" required class="stk-path-input" />
      </label>
      <button type="submit" class="btn-primary btn-sm">Create</button>
    </form>
  </fieldset>
  <script>
    (function () {
      var now = new Date();
      var plus24 = new Date(now.getTime() + 86400000);
      function fmt(d) { return d.toISOString().slice(0, 16); }
      var s = document.getElementById('sc-start');
      var e = document.getElementById('sc-stop');
      if (s && !s.value) s.value = fmt(now);
      if (e && !e.value) e.value = fmt(plus24);
    })();
  </script>

</div>
