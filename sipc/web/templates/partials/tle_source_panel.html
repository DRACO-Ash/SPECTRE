<form hx-post="/udl/tle-source"
      hx-target="#tle-source-status"
      hx-swap="innerHTML"
      style="display:flex; align-items:center; gap:0.5rem; flex-wrap:wrap">
  <select name="tle_source" style="width:auto; flex:1"
          title="Filter TLE fetches to a specific tracking source — leave as UDL Default to use the best available elset">
    <option value="">UDL Default (all sources)</option>
    {% for src in available %}
    <option value="{{ src }}"{% if src == tle_source %} selected{% endif %}>{{ src }}</option>
    {% endfor %}
  </select>
  <button type="submit" class="btn-secondary btn-sm" hx-disabled-elt="this">Set</button>
</form>
<div id="tle-source-status" style="margin-top:0.3rem">
  {% include "partials/tle_source_status.html" %}
</div>
