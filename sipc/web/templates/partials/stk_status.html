{% if error %}
<div class="stk-state stk-error">
  <span class="stk-label">STK &#9888; {{ error }}</span>
  <details class="stk-connect-wrap" open>
    <summary class="btn-secondary btn-sm">Retry</summary>
    {% include "partials/stk_connect_forms.html" %}
  </details>
</div>
<script>
(function(){
  var d = document.getElementById('stk-dropdown');
  if (!d) return;
  var dot = d.querySelector('.chip-dot');
  if (dot) dot.className = 'chip-dot dot-amber';
  var lbl = d.querySelector('.chip-label');
  if (lbl) lbl.textContent = 'STK \u26a0';
})();
</script>
{% elif stk_connected %}
<div class="stk-state stk-connected">
  <span class="stk-label">STK &#10003; Connected &mdash; <em>{{ stk_scenario or "running instance" }}</em></span>
  <span class="htmx-indicator" id="stk-disc-ind"><span class="spinner"></span>Disconnecting&hellip;</span>
  <button class="btn-secondary btn-sm"
          hx-post="/stk/disconnect"
          hx-target="#stk-status"
          hx-swap="innerHTML"
          hx-indicator="#stk-disc-ind"
          hx-disabled-elt="this">Disconnect</button>
</div>
<script>
(function(){
  var d = document.getElementById('stk-dropdown');
  if (!d) return;
  d.removeAttribute('open');
  var dot = d.querySelector('.chip-dot');
  if (dot) dot.className = 'chip-dot dot-green';
  var lbl = d.querySelector('.chip-label');
  if (lbl) lbl.textContent = 'STK \u2713';
})();
</script>
{% else %}
<div class="stk-state stk-disconnected">
  <span class="stk-label">STK &mdash; Not connected</span>
  <details class="stk-connect-wrap">
    <summary class="btn-secondary btn-sm">Connect</summary>
    {% include "partials/stk_connect_forms.html" %}
  </details>
</div>
<script>
(function(){
  var d = document.getElementById('stk-dropdown');
  if (!d) return;
  var dot = d.querySelector('.chip-dot');
  if (dot) dot.className = 'chip-dot dot-grey';
  var lbl = d.querySelector('.chip-label');
  if (lbl) lbl.textContent = 'STK';
})();
</script>
{% endif %}
