{% if name %}
<p class="field-success">&#10003; TLE loaded: <strong>{{ name }}</strong></p>
{% endif %}
{% if error %}
<p class="field-error">{{ error }}</p>
{% endif %}
<input name="name" placeholder="Name (e.g. Alpha)" value="{{ name }}" required />
<textarea name="tle" placeholder="TLE lines 1 &amp; 2" rows="2" required>{{ tle }}</textarea>
