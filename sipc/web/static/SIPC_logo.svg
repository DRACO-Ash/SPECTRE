<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="600" height="320">
  <defs>
    <!-- Deep navy background -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#001529"/>
      <stop offset="100%" stop-color="#000D1A"/>
    </radialGradient>

    <!-- Blue glow for orbital paths -->
    <filter id="blueGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Strong glow for key elements -->
    <filter id="strongGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Gold glow for intercept vector -->
    <filter id="goldGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Clip for the main emblem circle -->
    <clipPath id="circleClip">
      <circle cx="160" cy="160" r="128"/>
    </clipPath>

    <!-- Arrowhead markers -->
    <marker id="arrowGold" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0.5 L0,5.5 L5.5,3 Z" fill="#C8A415" opacity="0.9"/>
    </marker>
  </defs>

  <!-- BACKGROUND -->
  <rect width="600" height="320" fill="url(#bgGrad)"/>

  <!-- Accent bar at top -->
  <rect x="0" y="0" width="180" height="3" fill="#002244"/>
  <rect x="180" y="0" width="120" height="3" fill="#004990"/>
  <rect x="300" y="0" width="120" height="3" fill="#00659E"/>
  <rect x="420" y="0" width="180" height="3" fill="#C8A415"/>

  <!-- Subtle star field -->
  <g opacity="0.4">
    <circle cx="42" cy="18" r="0.8" fill="#ffffff"/>
    <circle cx="310" cy="12" r="0.6" fill="#ffffff"/>
    <circle cx="530" cy="30" r="0.9" fill="#ffffff"/>
    <circle cx="575" cy="80" r="0.5" fill="#ffffff"/>
    <circle cx="70" cy="290" r="0.7" fill="#ffffff"/>
    <circle cx="420" cy="305" r="0.6" fill="#ffffff"/>
    <circle cx="560" cy="270" r="0.8" fill="#ffffff"/>
    <circle cx="15" cy="190" r="0.5" fill="#ffffff"/>
    <circle cx="195" cy="8" r="0.6" fill="#ffffff"/>
    <circle cx="490" cy="15" r="0.7" fill="#ffffff"/>
    <circle cx="350" cy="295" r="0.9" fill="#ffffff"/>
    <circle cx="250" cy="310" r="0.5" fill="#ffffff"/>
    <circle cx="580" cy="180" r="0.6" fill="#ffffff"/>
  </g>

  <!-- EMBLEM (left side) -->
  <!-- Outer ring -->
  <circle cx="160" cy="160" r="134" fill="none" stroke="#004990" stroke-width="1.5" opacity="0.35"/>

  <!-- Main emblem background disc -->
  <circle cx="160" cy="160" r="128" fill="#001529" stroke="#003366" stroke-width="1"/>

  <!-- Subtle grid overlay inside emblem -->
  <g clip-path="url(#circleClip)" opacity="0.06">
    <line x1="32" y1="80"  x2="288" y2="80"  stroke="#00659E" stroke-width="0.5"/>
    <line x1="32" y1="120" x2="288" y2="120" stroke="#00659E" stroke-width="0.5"/>
    <line x1="32" y1="160" x2="288" y2="160" stroke="#00659E" stroke-width="0.5"/>
    <line x1="32" y1="200" x2="288" y2="200" stroke="#00659E" stroke-width="0.5"/>
    <line x1="32" y1="240" x2="288" y2="240" stroke="#00659E" stroke-width="0.5"/>
    <line x1="80"  y1="32" x2="80"  y2="288" stroke="#00659E" stroke-width="0.5"/>
    <line x1="120" y1="32" x2="120" y2="288" stroke="#00659E" stroke-width="0.5"/>
    <line x1="160" y1="32" x2="160" y2="288" stroke="#00659E" stroke-width="0.5"/>
    <line x1="200" y1="32" x2="200" y2="288" stroke="#00659E" stroke-width="0.5"/>
    <line x1="240" y1="32" x2="240" y2="288" stroke="#00659E" stroke-width="0.5"/>
  </g>

  <!-- Earth body -->
  <circle cx="160" cy="160" r="38" fill="#002244" stroke="#004990" stroke-width="1.2" filter="url(#blueGlow)"/>
  <!-- Earth highlight -->
  <ellipse cx="150" cy="148" rx="12" ry="8" fill="#003366" opacity="0.6"/>
  <!-- Earth glow -->
  <circle cx="160" cy="160" r="42" fill="none" stroke="#00659E" stroke-width="0.8" opacity="0.35"/>

  <!-- Orbital Path A (target orbit — full ellipse, blue) -->
  <ellipse cx="160" cy="160" rx="95" ry="55"
           fill="none" stroke="#00659E" stroke-width="1.2"
           stroke-dasharray="6 3" opacity="0.5"
           filter="url(#blueGlow)"
           transform="rotate(-20 160 160)"/>

  <!-- Orbital Path B (interceptor orbit — tighter, more inclined) -->
  <ellipse cx="160" cy="160" rx="78" ry="38"
           fill="none" stroke="#004990" stroke-width="1"
           stroke-dasharray="4 4" opacity="0.3"
           transform="rotate(35 160 160)"/>

  <!-- Target satellite (top-right of orbit A) -->
  <g transform="translate(200, 96)" filter="url(#strongGlow)">
    <rect x="-5" y="-4" width="10" height="8" fill="#00659E" rx="1" opacity="0.9"/>
    <rect x="-17" y="-2" width="9" height="4" fill="#00659E" opacity="0.6" rx="0.5"/>
    <rect x="8"  y="-2" width="9" height="4" fill="#00659E" opacity="0.6" rx="0.5"/>
    <line x1="0" y1="-4" x2="0" y2="-9" stroke="#00659E" stroke-width="0.8" opacity="0.8"/>
    <circle cx="0" cy="-10" r="1.5" fill="none" stroke="#00659E" stroke-width="0.8"/>
  </g>

  <!-- Target marker (dashed diamond, gold) -->
  <g transform="translate(200, 96)">
    <rect x="-13" y="-13" width="26" height="26" fill="none" stroke="#C8A415" stroke-width="0.9"
          stroke-dasharray="3 2" opacity="0.7" transform="rotate(45)"/>
  </g>

  <!-- Interceptor satellite (lower-left of orbit B) -->
  <g transform="translate(104, 218)" filter="url(#strongGlow)">
    <rect x="-5" y="-4" width="10" height="8" fill="#C8A415" rx="1" opacity="0.85"/>
    <rect x="-15" y="-2" width="8" height="4" fill="#C8A415" opacity="0.45" rx="0.5"/>
    <rect x="7"  y="-2" width="8" height="4" fill="#C8A415" opacity="0.45" rx="0.5"/>
    <line x1="0" y1="4" x2="0" y2="9" stroke="#C8A415" stroke-width="0.8" opacity="0.7"/>
  </g>

  <!-- Intercept vector (interceptor to target, gold dashed line) -->
  <line x1="114" y1="212" x2="192" y2="104"
        stroke="#C8A415" stroke-width="1.4"
        stroke-dasharray="5 3"
        marker-end="url(#arrowGold)"
        opacity="0.7"
        filter="url(#goldGlow)"/>

  <!-- Intercept point flash (small cross at midpoint ~153,158) -->
  <g transform="translate(153, 158)" filter="url(#goldGlow)">
    <line x1="-6" y1="0" x2="6" y2="0" stroke="#C8A415" stroke-width="1.2" opacity="0.85"/>
    <line x1="0" y1="-6" x2="0" y2="6" stroke="#C8A415" stroke-width="1.2" opacity="0.85"/>
    <circle cx="0" cy="0" r="3.5" fill="none" stroke="#C8A415" stroke-width="0.8" opacity="0.5"/>
  </g>

  <!-- HUD targeting reticle (outer) -->
  <circle cx="160" cy="160" r="110" fill="none" stroke="#003366" stroke-width="0.7" opacity="0.4"/>

  <!-- Reticle tick marks -->
  <g stroke="#00659E" stroke-width="1.2" opacity="0.4">
    <line x1="160" y1="32"  x2="160" y2="46"/>
    <line x1="160" y1="274" x2="160" y2="288"/>
    <line x1="274" y1="160" x2="288" y2="160"/>
    <line x1="32"  y1="160" x2="46"  y2="160"/>
    <line x1="237" y1="83"  x2="228" y2="92"/>
    <line x1="83"  y1="83"  x2="92"  y2="92"/>
    <line x1="237" y1="237" x2="228" y2="228"/>
    <line x1="83"  y1="237" x2="92"  y2="228"/>
  </g>

  <!-- Degree labels -->
  <g font-family="'Segoe UI', sans-serif" font-size="7" fill="#00659E" opacity="0.4" text-anchor="middle">
    <text x="160" y="29">000</text>
    <text x="160" y="299">180</text>
    <text x="298" y="163">090</text>
    <text x="22"  y="163">270</text>
  </g>

  <!-- Inner ring -->
  <circle cx="160" cy="160" r="44" fill="none" stroke="#003366" stroke-width="0.8" opacity="0.4"/>

  <!-- Emblem border ring -->
  <circle cx="160" cy="160" r="128" fill="none" stroke="#004990" stroke-width="1.8" opacity="0.5"/>
  <circle cx="160" cy="160" r="125" fill="none" stroke="#003366" stroke-width="0.6" opacity="0.25"/>

  <!-- RIGHT SIDE — TEXT BLOCK -->

  <!-- Divider line -->
  <line x1="308" y1="68" x2="308" y2="252" stroke="#004990" stroke-width="0.8" opacity="0.4"/>

  <!-- Application acronym (ghost text) -->
  <text x="328" y="138"
        font-family="'Segoe UI', sans-serif"
        font-size="72"
        font-weight="800"
        letter-spacing="6"
        fill="none"
        stroke="#004990"
        stroke-width="0.6"
        opacity="0.08">SIPC</text>

  <text x="328" y="138"
        font-family="'Segoe UI', sans-serif"
        font-size="72"
        font-weight="800"
        letter-spacing="6"
        fill="#D0D8E8"
        filter="url(#blueGlow)">SIPC</text>

  <!-- Separator bar under acronym -->
  <line x1="328" y1="150" x2="576" y2="150" stroke="#004990" stroke-width="1" opacity="0.5"/>
  <line x1="328" y1="152" x2="420" y2="152" stroke="#C8A415" stroke-width="1.5" opacity="0.7" filter="url(#goldGlow)"/>

  <!-- Full application name — two lines -->
  <text x="328" y="173"
        font-family="'Segoe UI', sans-serif"
        font-size="12.5"
        font-weight="600"
        letter-spacing="3.5"
        fill="#7A9CC0">SPACE INTERCEPT</text>

  <text x="328" y="193"
        font-family="'Segoe UI', sans-serif"
        font-size="12.5"
        font-weight="600"
        letter-spacing="3.5"
        fill="#7A9CC0">PLANNING CONSOLE</text>

  <!-- Bottom classification / programme line -->
  <line x1="328" y1="210" x2="576" y2="210" stroke="#003366" stroke-width="0.7" opacity="0.4"/>

  <text x="328" y="228"
        font-family="'Segoe UI', sans-serif"
        font-size="8.5"
        font-weight="600"
        letter-spacing="2"
        fill="#5A7A9A"
        opacity="0.8">ORBITAL WARFARE &middot; MODELLING &amp; SIMULATION</text>

  <text x="328" y="246"
        font-family="'Segoe UI', sans-serif"
        font-size="8"
        letter-spacing="1.5"
        fill="#3D5A78"
        opacity="0.7">INTERCEPT TRAJECTORY ANALYSIS SYSTEM</text>

  <!-- Gold accent corner marks (command authority) -->
  <g stroke="#C8A415" stroke-width="1.2" opacity="0.5" filter="url(#goldGlow)">
    <line x1="316" y1="60" x2="328" y2="60"/>
    <line x1="316" y1="60" x2="316" y2="72"/>
    <line x1="576" y1="60" x2="564" y2="60"/>
    <line x1="576" y1="60" x2="576" y2="72"/>
    <line x1="316" y1="258" x2="328" y2="258"/>
    <line x1="316" y1="258" x2="316" y2="246"/>
    <line x1="576" y1="258" x2="564" y2="258"/>
    <line x1="576" y1="258" x2="576" y2="246"/>
  </g>

  <!-- Version tag -->
  <text x="572" y="312"
        font-family="'Segoe UI', sans-serif"
        font-size="7"
        letter-spacing="1"
        fill="#003366"
        text-anchor="end"
        opacity="0.5">v2.0 // SIPC</text>
</svg>
