<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" fill="#020609"/>
  <!-- Outer ring -->
  <circle cx="50" cy="50" r="46" fill="none" stroke="#0e7490" stroke-width="1.5" opacity="0.7"/>
  <!-- Earth -->
  <circle cx="50" cy="50" r="13" fill="#0a2a42" stroke="#1a6a9a" stroke-width="1.2"/>
  <!-- Orbit A (target) -->
  <ellipse cx="50" cy="50" rx="34" ry="20" fill="none" stroke="#22d3ee" stroke-width="1.5"
           stroke-dasharray="4 2" opacity="0.65" transform="rotate(-20 50 50)"/>
  <!-- Orbit B (interceptor) -->
  <ellipse cx="50" cy="50" rx="27" ry="14" fill="none" stroke="#06b6d4" stroke-width="1"
           stroke-dasharray="3 3" opacity="0.4" transform="rotate(35 50 50)"/>
  <!-- Target satellite (cyan) -->
  <rect x="65" y="22" width="7" height="5" fill="#22d3ee" rx="0.5" opacity="0.9"/>
  <!-- Interceptor (green) -->
  <rect x="27" y="71" width="7" height="5" fill="#4ade80" rx="0.5" opacity="0.9"/>
  <!-- Intercept vector (amber) -->
  <line x1="33" y1="73" x2="67" y2="28" stroke="#f59e0b" stroke-width="1.5"
        stroke-dasharray="4 2" opacity="0.85"/>
  <!-- Reticle cardinal ticks -->
  <g stroke="#22d3ee" stroke-width="1" opacity="0.5">
    <line x1="50" y1="4"  x2="50" y2="10"/>
    <line x1="50" y1="90" x2="50" y2="96"/>
    <line x1="4"  y1="50" x2="10" y2="50"/>
    <line x1="90" y1="50" x2="96" y2="50"/>
  </g>
  <!-- Emblem border -->
  <circle cx="50" cy="50" r="46" fill="none" stroke="#0e7490" stroke-width="1" opacity="0.5"/>
</svg>
