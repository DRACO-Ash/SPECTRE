<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="600" height="320">
  <defs>
    <!-- Deep space background -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#050d18"/>
      <stop offset="100%" stop-color="#020609"/>
    </radialGradient>

    <!-- Cyan glow for orbital paths -->
    <filter id="cyanGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Strong glow for key elements -->
    <filter id="strongGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Amber glow for intercept vector -->
    <filter id="amberGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Subtle noise texture -->
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feBlend in="SourceGraphic" mode="overlay" result="blend"/>
      <feComposite in="blend" in2="SourceGraphic" operator="in"/>
    </filter>

    <!-- Clip for the main emblem circle -->
    <clipPath id="circleClip">
      <circle cx="160" cy="160" r="128"/>
    </clipPath>

    <!-- Arrowhead marker for intercept vector -->
    <marker id="arrowAmber" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0.5 L0,5.5 L5.5,3 Z" fill="#f59e0b" opacity="0.9"/>
    </marker>
    <marker id="arrowCyan" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0.5 L0,5.5 L5.5,3 Z" fill="#22d3ee" opacity="0.7"/>
    </marker>
  </defs>

  <!-- ─── BACKGROUND ─── -->
  <rect width="600" height="320" fill="url(#bgGrad)"/>

  <!-- Subtle star field -->
  <g opacity="0.5">
    <circle cx="42" cy="18" r="0.8" fill="#ffffff"/>
    <circle cx="310" cy="12" r="0.6" fill="#ffffff"/>
    <circle cx="530" cy="30" r="0.9" fill="#ffffff"/>
    <circle cx="575" cy="80" r="0.5" fill="#ffffff"/>
    <circle cx="70" cy="290" r="0.7" fill="#ffffff"/>
    <circle cx="420" cy="305" r="0.6" fill="#ffffff"/>
    <circle cx="560" cy="270" r="0.8" fill="#ffffff"/>
    <circle cx="15" cy="190" r="0.5" fill="#ffffff"/>
    <circle cx="195" cy="8" r="0.6" fill="#ffffff"/>
    <circle cx="490" cy="15" r="0.7" fill="#ffffff"/>
    <circle cx="350" cy="295" r="0.9" fill="#ffffff"/>
    <circle cx="250" cy="310" r="0.5" fill="#ffffff"/>
    <circle cx="580" cy="180" r="0.6" fill="#ffffff"/>
  </g>

  <!-- ─── EMBLEM (left side) ─── -->
  <!-- Outer ring -->
  <circle cx="160" cy="160" r="134" fill="none" stroke="#0e4a6e" stroke-width="1.5" opacity="0.4"/>

  <!-- Main emblem background disc -->
  <circle cx="160" cy="160" r="128" fill="#03111e" stroke="#0a3a5a" stroke-width="1"/>

  <!-- Subtle grid overlay inside emblem -->
  <g clip-path="url(#circleClip)" opacity="0.07">
    <line x1="32" y1="80"  x2="288" y2="80"  stroke="#22d3ee" stroke-width="0.5"/>
    <line x1="32" y1="120" x2="288" y2="120" stroke="#22d3ee" stroke-width="0.5"/>
    <line x1="32" y1="160" x2="288" y2="160" stroke="#22d3ee" stroke-width="0.5"/>
    <line x1="32" y1="200" x2="288" y2="200" stroke="#22d3ee" stroke-width="0.5"/>
    <line x1="32" y1="240" x2="288" y2="240" stroke="#22d3ee" stroke-width="0.5"/>
    <line x1="80"  y1="32" x2="80"  y2="288" stroke="#22d3ee" stroke-width="0.5"/>
    <line x1="120" y1="32" x2="120" y2="288" stroke="#22d3ee" stroke-width="0.5"/>
    <line x1="160" y1="32" x2="160" y2="288" stroke="#22d3ee" stroke-width="0.5"/>
    <line x1="200" y1="32" x2="200" y2="288" stroke="#22d3ee" stroke-width="0.5"/>
    <line x1="240" y1="32" x2="240" y2="288" stroke="#22d3ee" stroke-width="0.5"/>
  </g>

  <!-- Earth body -->
  <circle cx="160" cy="160" r="38" fill="#0a2a42" stroke="#0f4a72" stroke-width="1.2" filter="url(#cyanGlow)"/>
  <!-- Earth highlight -->
  <ellipse cx="150" cy="148" rx="12" ry="8" fill="#0d3d60" opacity="0.6"/>
  <!-- Earth glow -->
  <circle cx="160" cy="160" r="42" fill="none" stroke="#1a6a9a" stroke-width="0.8" opacity="0.4"/>

  <!-- ── Orbital Path A (target orbit — full ellipse, cyan) -->
  <ellipse cx="160" cy="160" rx="95" ry="55"
           fill="none" stroke="#22d3ee" stroke-width="1.2"
           stroke-dasharray="6 3" opacity="0.55"
           filter="url(#cyanGlow)"
           transform="rotate(-20 160 160)"/>

  <!-- ── Orbital Path B (interceptor orbit — tighter, more inclined) -->
  <ellipse cx="160" cy="160" rx="78" ry="38"
           fill="none" stroke="#06b6d4" stroke-width="1"
           stroke-dasharray="4 4" opacity="0.35"
           transform="rotate(35 160 160)"/>

  <!-- ── Target satellite (top-right of orbit A) -->
  <!-- Position on orbit A at ~-20deg rotation, angle ~60deg -->
  <!-- Computed: cx=160+95*cos(60°)*cos(20°)-55*sin(60°)*sin(20°) ≈ 160+44.7-16.3=188, cy=160-95*cos(60°)*sin(20°)-55*sin(60°)*cos(20°) ≈ 160-16.3-44.7=99 -->
  <g transform="translate(200, 96)" filter="url(#strongGlow)">
    <!-- Satellite body -->
    <rect x="-5" y="-4" width="10" height="8" fill="#22d3ee" rx="1" opacity="0.9"/>
    <!-- Solar panels -->
    <rect x="-17" y="-2" width="9" height="4" fill="#22d3ee" opacity="0.6" rx="0.5"/>
    <rect x="8"  y="-2" width="9" height="4" fill="#22d3ee" opacity="0.6" rx="0.5"/>
    <!-- Antenna -->
    <line x1="0" y1="-4" x2="0" y2="-9" stroke="#22d3ee" stroke-width="0.8" opacity="0.8"/>
    <circle cx="0" cy="-10" r="1.5" fill="none" stroke="#22d3ee" stroke-width="0.8"/>
  </g>

  <!-- Target marker (dashed diamond) -->
  <g transform="translate(200, 96)">
    <rect x="-13" y="-13" width="26" height="26" fill="none" stroke="#f59e0b" stroke-width="0.9"
          stroke-dasharray="3 2" opacity="0.7" transform="rotate(45)"/>
  </g>

  <!-- ── Interceptor satellite (lower-left of orbit B) -->
  <!-- On orbit B at angle ~210deg: x=160+78*cos(210+35), y=160+38*sin(210+35) ≈ translate(105, 220) -->
  <g transform="translate(104, 218)" filter="url(#strongGlow)">
    <rect x="-5" y="-4" width="10" height="8" fill="#4ade80" rx="1" opacity="0.9"/>
    <rect x="-15" y="-2" width="8" height="4" fill="#4ade80" opacity="0.5" rx="0.5"/>
    <rect x="7"  y="-2" width="8" height="4" fill="#4ade80" opacity="0.5" rx="0.5"/>
    <line x1="0" y1="4" x2="0" y2="9" stroke="#4ade80" stroke-width="0.8" opacity="0.8"/>
  </g>

  <!-- ── Intercept vector (interceptor → target, amber dashed line) -->
  <line x1="114" y1="212" x2="192" y2="104"
        stroke="#f59e0b" stroke-width="1.4"
        stroke-dasharray="5 3"
        marker-end="url(#arrowAmber)"
        opacity="0.75"
        filter="url(#amberGlow)"/>

  <!-- Intercept point flash (small cross at midpoint ~153,158) -->
  <g transform="translate(153, 158)" filter="url(#amberGlow)">
    <line x1="-6" y1="0" x2="6" y2="0" stroke="#f59e0b" stroke-width="1.2" opacity="0.9"/>
    <line x1="0" y1="-6" x2="0" y2="6" stroke="#f59e0b" stroke-width="1.2" opacity="0.9"/>
    <circle cx="0" cy="0" r="3.5" fill="none" stroke="#f59e0b" stroke-width="0.8" opacity="0.6"/>
  </g>

  <!-- ── HUD targeting reticle (outer) -->
  <circle cx="160" cy="160" r="110" fill="none" stroke="#1a4a6a" stroke-width="0.7" opacity="0.5"/>

  <!-- Reticle tick marks -->
  <g stroke="#22d3ee" stroke-width="1.2" opacity="0.5">
    <!-- N -->
    <line x1="160" y1="32"  x2="160" y2="46"/>
    <!-- S -->
    <line x1="160" y1="274" x2="160" y2="288"/>
    <!-- E -->
    <line x1="274" y1="160" x2="288" y2="160"/>
    <!-- W -->
    <line x1="32"  y1="160" x2="46"  y2="160"/>
    <!-- NE -->
    <line x1="237" y1="83"  x2="228" y2="92"/>
    <!-- NW -->
    <line x1="83"  y1="83"  x2="92"  y2="92"/>
    <!-- SE -->
    <line x1="237" y1="237" x2="228" y2="228"/>
    <!-- SW -->
    <line x1="83"  y1="237" x2="92"  y2="228"/>
  </g>

  <!-- Degree labels (sparse, military style) -->
  <g font-family="'Courier New', monospace" font-size="7" fill="#22d3ee" opacity="0.45" text-anchor="middle">
    <text x="160" y="29">000</text>
    <text x="160" y="299">180</text>
    <text x="298" y="163">090</text>
    <text x="22"  y="163">270</text>
  </g>

  <!-- Inner ring -->
  <circle cx="160" cy="160" r="44" fill="none" stroke="#0d3a5a" stroke-width="0.8" opacity="0.5"/>

  <!-- Emblem border ring (styled) -->
  <circle cx="160" cy="160" r="128" fill="none" stroke="#0e7490" stroke-width="1.8" opacity="0.6"/>
  <circle cx="160" cy="160" r="125" fill="none" stroke="#0e4a6e" stroke-width="0.6" opacity="0.3"/>

  <!-- ─── RIGHT SIDE — TEXT BLOCK ─── -->

  <!-- Divider line -->
  <line x1="308" y1="68" x2="308" y2="252" stroke="#0e7490" stroke-width="0.8" opacity="0.5"/>

  <!-- Application acronym -->
  <text x="328" y="138"
        font-family="'Courier New', monospace"
        font-size="72"
        font-weight="700"
        letter-spacing="6"
        fill="none"
        stroke="#22d3ee"
        stroke-width="0.6"
        opacity="0.12">SIPC</text>

  <text x="328" y="138"
        font-family="'Courier New', monospace"
        font-size="72"
        font-weight="700"
        letter-spacing="6"
        fill="#e0f7fc"
        filter="url(#cyanGlow)">SIPC</text>

  <!-- Separator bar under acronym -->
  <line x1="328" y1="150" x2="576" y2="150" stroke="#0e7490" stroke-width="1" opacity="0.6"/>
  <line x1="328" y1="152" x2="420" y2="152" stroke="#f59e0b" stroke-width="1.5" opacity="0.7" filter="url(#amberGlow)"/>

  <!-- Full application name — two lines -->
  <text x="328" y="173"
        font-family="'Courier New', monospace"
        font-size="12.5"
        font-weight="400"
        letter-spacing="3.5"
        fill="#94d8e8">STK INTERCEPT</text>

  <text x="328" y="193"
        font-family="'Courier New', monospace"
        font-size="12.5"
        font-weight="400"
        letter-spacing="3.5"
        fill="#94d8e8">PLANNING CONSOLE</text>

  <!-- Bottom classification / programme line -->
  <line x1="328" y1="210" x2="576" y2="210" stroke="#0e4a6e" stroke-width="0.7" opacity="0.5"/>

  <text x="328" y="228"
        font-family="'Courier New', monospace"
        font-size="8.5"
        letter-spacing="2"
        fill="#3b7a9a"
        opacity="0.8">ORBITAL WARFARE ∙ MODELLING &amp; SIMULATION</text>

  <text x="328" y="246"
        font-family="'Courier New', monospace"
        font-size="8"
        letter-spacing="1.5"
        fill="#2a5a7a"
        opacity="0.7">INTERCEPT TRAJECTORY ANALYSIS SYSTEM</text>

  <!-- Amber accent corner marks (tactical HUD feel) -->
  <g stroke="#f59e0b" stroke-width="1.2" opacity="0.55" filter="url(#amberGlow)">
    <!-- Top-left of text block -->
    <line x1="316" y1="60" x2="328" y2="60"/>
    <line x1="316" y1="60" x2="316" y2="72"/>
    <!-- Top-right -->
    <line x1="576" y1="60" x2="564" y2="60"/>
    <line x1="576" y1="60" x2="576" y2="72"/>
    <!-- Bottom-left -->
    <line x1="316" y1="258" x2="328" y2="258"/>
    <line x1="316" y1="258" x2="316" y2="246"/>
    <!-- Bottom-right -->
    <line x1="576" y1="258" x2="564" y2="258"/>
    <line x1="576" y1="258" x2="576" y2="246"/>
  </g>

  <!-- Version / build tag (bottom right, very subtle) -->
  <text x="572" y="312"
        font-family="'Courier New', monospace"
        font-size="7"
        letter-spacing="1"
        fill="#1a4a6a"
        text-anchor="end"
        opacity="0.6">v1.0 // BLD-001</text>
</svg>
