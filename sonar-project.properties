# SonarQube scanner configuration for SPECTRE.
#
# Committed so the platform's Code Quality stage scopes sources, tests and the
# coverage report the same way the local loop does. Without it the scanner
# guesses, and a guessed scope is the usual cause of a 0% coverage score on a
# suite that actually passes.

sonar.projectKey=spectre
sonar.projectName=SPECTRE
sonar.projectVersion=0.4.0

# ── Scope ─────────────────────────────────────────────────────────────────────
# Application code that ships or is exercised by the suite. Analysis covers all
# of it; nothing below is excluded from analysis, only from the coverage metric
# where a rationale is given.
sonar.sources=spectre,tle_clustering
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# docs/ holds one-off document-generator scripts (generate_guide.py,
# build_gcat_workbook_1.py) that are neither imported by the application nor
# shipped in the container, and query_UDL_Data.py is a standalone operator
# utility. They are not part of the deployed system, so they are outside the
# analysed sources rather than excluded from it.

# ── Language ──────────────────────────────────────────────────────────────────
sonar.python.version=3.12

# ── Coverage ──────────────────────────────────────────────────────────────────
# The gate reads coverage.xml for Python. Generated by:
#   pytest --cov --cov-report=xml:coverage.xml
sonar.python.coverage.reportPaths=coverage.xml

# Coverage exclusions (metric only, still fully analysed). Each needs a reason.
#
#   spectre/app_logging/config.py
#     Logging handler wiring: configures structlog processors and file handlers
#     at process start. Exercising it under test would write real log files and
#     mutate global logging state for every other test, and asserting on
#     handler configuration tests the standard library rather than SPECTRE.
sonar.coverage.exclusions=spectre/app_logging/config.py

# ── Duplication ───────────────────────────────────────────────────────────────
# Test modules legitimately repeat short arrange blocks; shared fixtures live in
# tests/conftest.py and tests/integration/conftest.py. Measured duplication
# across the changed set is 0%.
