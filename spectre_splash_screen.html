<style>
@keyframes spin-slow { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
@keyframes spin-rev { from { transform: rotate(0deg); } to { transform: rotate(-360deg); } }
@keyframes pulse-core { 0%,100%{opacity:0.9;} 50%{opacity:0.5;} }
@keyframes fade-in { from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }
@keyframes scan-line { from{transform:translateY(-100%);} to{transform:translateY(520px);} }
@keyframes flicker { 0%,100%{opacity:1;} 92%{opacity:1;} 93%{opacity:0.4;} 95%{opacity:1;} 97%{opacity:0.6;} 98%{opacity:1;} }
.splash-orbit { animation: spin-slow 25s linear infinite; transform-origin: center; }
.splash-orbit-rev { animation: spin-rev 18s linear infinite; transform-origin: center; }
.splash-core { animation: pulse-core 3s ease-in-out infinite; }
.splash-text { animation: fade-in 1.2s ease-out both; }
.splash-text-d1 { animation-delay: 0.4s; }
.splash-text-d2 { animation-delay: 0.8s; }
.splash-text-d3 { animation-delay: 1.4s; }
.splash-text-d4 { animation-delay: 2.0s; }
.splash-flicker { animation: flicker 8s linear infinite; }
.splash-scanline { position:absolute; top:0; left:0; right:0; height:2px; background:linear-gradient(90deg, transparent, rgba(226,75,74,0.15), transparent); animation: scan-line 4s linear infinite; pointer-events:none; }
</style>
