; Standalone rather than in pyproject.toml on purpose.
;
; pyproject.toml is excluded from the App Store submission package: it is a
; recognised dependency manifest, and the platform's Dependency Scanning
; analyser processes every manifest it finds in the chosen directory. A
; pyproject.toml with no poetry.lock or uv.lock beside it is the one constant
; across every failed submission. The suite still has to run inside that
; package, so its configuration lives in a file the analyser ignores.
[pytest]
testpaths = tests
markers =
    integration: marks tests requiring a live network connection (deselect with -m 'not integration')
addopts = -ra -q
asyncio_mode = auto
