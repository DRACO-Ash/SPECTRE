  - id: observer_04_decision_engine_intro
    title: "Decision Engine — Adversary Response Planning"
    level_required: 3
    difficulty: medium
    description: >
      Use the Decision Engine panel to evaluate adversary actions against a GEO asset.
      Enter the scenario manually, run the evaluation, and identify the minimax-optimal
      response strategy.
    briefing: >
      Intelligence suggests ADVERSARY-GEO may attempt one of three actions:
      proximity approach (probability 0.5), electronic interference (probability 0.3),
      or no action (probability 0.2).  You have four response options:
