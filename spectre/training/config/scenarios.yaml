        tle_line2: "2 99050   0.1000  60.0000 0000400  30.0000   0.0000  1.00270000 00008"
      - satno: 99051
        name: "BLUE-GEO-REF"
        side: blue
        regime: GEO
        tle_line1: "1 99051U 25051A   25213.00000000  .00000000  00000-0  00000-0 0  9991"
        tle_line2: "2 99051   0.0300  59.0000 0000200  10.0000   0.0000  1.00270000 00005"
    tool_workflow: >
      1. SPECTRE Console → Assets panel → confirm RSO-NOTSO (Red) and BLUE-GEO-REF (Blue) are loaded.
      2. Read the NOTSO notification from the briefing:
         window 2025-08-05 04:00–06:00Z, ΔV 0.08–0.12 km/s, east-west station change.
      3. Read the detection data from the briefing:
         epoch 05:12Z on 2025-08-05, ΔV 0.09 km/s, east-west direction.
      4. Check each criterion:
         a. Timing: 05:12Z is within 04:00–06:00Z → criterion MET.
         b. Magnitude: 0.09 km/s is within 0.08–0.12 km/s → criterion MET.
         c. Direction: east-west consistent with notification → criterion MET.
      5. All three criteria met → verdict is COMPLIANT.  Tick Objectives 3, 4, and 5.
         For Objective 5 enter "compliant" as your verdict.
    objectives:
