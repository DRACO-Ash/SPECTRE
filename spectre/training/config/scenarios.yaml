        tle_line2: "2 99021  51.6000 100.0200 0001800  45.2000 314.8000 15.49000000 00009"
    tool_workflow: >
      1. SPECTRE Console → Assets panel → confirm BLUE-INS (Blue) and UNKNOWN-RSO (Red) are pre-loaded.
