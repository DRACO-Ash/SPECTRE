  - id: observer_05_notso_correlation
    title: "Manoeuvre Notification Compliance — NOTSO Assessment"
    level_required: 3
    difficulty: medium
    description: >
      A space object operator filed a manoeuvre notification (NOTSO).  Pre-processed
      intelligence has characterised a manoeuvre detected on that object.  Compare the
      notification against the detection data and render a compliance verdict.
      All comparison data is provided in the briefing — no Pattern of Life run required.
    briefing: >
      RSO-NOTSO filed a notification for 2025-08-05 04:00–06:00Z,
      estimated ΔV 0.08–0.12 km/s, east-west station change.
      Prior catalogue analysis detected: manoeuvre epoch 2025-08-05 05:12Z,
      estimated ΔV 0.09 km/s, east-west direction.
      Compliance criteria — all three must be met for a COMPLIANT verdict:
        a) Detected epoch falls within the notified window.
        b) Detected ΔV magnitude is within the notified range.
        c) Detected direction is consistent with the notification.
    scenario_epoch_utc: "2025-08-01T00:00:00Z"
    horizon_hours: 120
    challenge: false
    objects:
      - satno: 99050
        name: "RSO-NOTSO"
