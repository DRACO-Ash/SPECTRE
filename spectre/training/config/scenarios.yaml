# SPECTRE Training Scenario Library
# All data is SYNTHETIC.  Orbital parameters are realistic but no real object.
# Each scenario is completely isolated from operational data.
#
# TOOL CAPABILITIES WITH SYNTHETIC TLEs (99xxx SATNOs do not exist in UDL):
#   Assets panel       — Load objects by pasting TLE lines.  Shows all orbital elements.
#                        Works with any TLE regardless of SATNO.
#   Intercept Engine   — Requires BOTH a Blue asset AND a Red track pre-loaded in Assets.
#                        Outputs: total_delta_v_km_s, intercept_range_km (post-manoeuvre miss
#                        distance), arrival_epoch, individual burn ΔVs.  Uses SGP4 propagation.
#   Decision Engine    — Manual entry of adversary actions + friendly responses.  Fully
#                        analytical.  No UDL required.  Outputs ranked matrix + robust response.
#   Pattern of Life    — Queries UDL by SATNO.  NOT usable with 99xxx training SATNOs.
#   Threat Sweep / HRR — Fetches TLEs from UDL by SATNO.  NOT usable with 99xxx SATNOs.
#   NOTSO panel        — Not yet implemented; also depends on PoL.
#   Monte Carlo        — Not yet implemented.
#
# DESIGN RULES ENFORCED IN THIS FILE:
#   1. Every numeric answer must come from the briefing text OR the Intercept Engine output.
#   2. All qualitative decisions (posture, verdict, recommendation) are self-cert checkboxes
#      with no answer field — the operator ticks when they have completed the action.
#   3. Every scenario that references the Intercept Engine must have BOTH Blue and Red objects.
#   4. No scenario references PoL, HRR/Threat Sweep auto-fetch, NOTSO, or Monte Carlo.
#   5. Pre-processed intelligence (manoeuvre history, TCA, conjunction distances) is provided
#      in the briefing text so the operator can read it without running PoL.

scenarios:

  # ── Level 1 / Cadet ─────────────────────────────────────────────────────────

  - id: cadet_01_geo_stationkeeping
    title: "GEO Station-Keeping — Routine Manoeuvre"
    level_required: 1
    difficulty: easy
    description: >
      A geostationary communications satellite (BLUE-01) must perform a routine
      north-south station-keeping burn to maintain its assigned longitude slot.
      No threat present.  Practise loading the scenario, reading orbital elements
      from the Assets panel, and interpreting the ΔV requirement from the briefing.
    briefing: >
      BLUE-01 has drifted 0.08° from its assigned longitude slot at 45.0° East.
      Station-keeping budget: 50 m/s residual.
      Mission computer output: required corrective ΔV = 2.0 m/s (0.002 km/s)
      north-south component — well within budget.  Execute by 2025-06-15 12:00Z.
      No threat object is present.  This is a single-asset maintenance task.
    scenario_epoch_utc: "2025-06-15T00:00:00Z"
    horizon_hours: 24
    objects:
      - satno: 99001
        name: "BLUE-01"
        side: blue
        regime: GEO
        tle_line1: "1 99001U 25001A   25166.00000000  .00000000  00000-0  00000-0 0  9991"
        tle_line2: "2 99001   0.0100  45.0000 0000200  90.0000   0.0000  1.00270000 00011"
    tool_workflow: >
      This is a single-asset scenario — no Red track or Intercept Engine is required.
      1. Open the SPECTRE Console tab (sidebar → ⚙ SPECTRE Console).
      2. Assets panel → confirm BLUE-01 appears in the Blue Assets list (pre-loaded by the scenario).
         If not, click Quick-Add Blue and paste the TLE lines from the objects list above.
      3. Click BLUE-01 in the Assets panel to expand its orbital elements.
         Read the RAAN field — for a GEO satellite this equals the sub-satellite longitude in degrees East.
         Record this value to answer Objective 2.
      4. Read the briefing: the mission computer ΔV of 2.0 m/s (0.002 km/s) is stated directly.
         Confirm it is within the 50 m/s budget and enter this value for Objective 3.
      5. Tick all objectives and click Submit & Score.
    objectives:
      - id: obj_load
        description: "Confirm BLUE-01 is loaded as a Blue asset in the Assets panel"
        skill_axis: situational_awareness
        points: 10
      - id: obj_read_elements
        description: "Read the assigned longitude from the BLUE-01 orbital elements (RAAN field) — answer in degrees East"
        skill_axis: situational_awareness
        points: 20
        answer: "45.0"
        tolerance: 0.5
        unit: "degrees East"
      - id: obj_confirm_dv
        description: "Enter the corrective ΔV stated by the mission computer in the briefing (km/s)"
        skill_axis: manoeuvre_planning
        points: 30
        answer: "0.002"
        tolerance: 0.001
        unit: "km/s"
    time_limit_minutes: null
    scoring:
      passing_score: 50
      optimal_score: 60

  # ── Level 2 / Observer ───────────────────────────────────────────────────────

  - id: observer_02_proximity_threat
    title: "Proximity Operations Threat — LEO Approach"
    level_required: 2
    difficulty: moderate
    description: >
      A red object (RED-01) in LEO is closing on a friendly asset (BLUE-02).
      Load both objects, use the Intercept Engine to characterise the geometry,
      and select the correct response posture based on standing orders.
    briefing: >
      BLUE-02 (ISS-altitude circular orbit, 51.6° inclination) has a co-planar
      object RED-01 closing at approximately 120 m/s range-rate.
      Intelligence assessment: predicted closest approach T+4.5 hours, ~2.1 km range.
      Standing orders: HEIGHTENED AWARENESS posture is required when predicted
      closest approach is below 5 km.  You have 15 minutes to assess and recommend.
    scenario_epoch_utc: "2025-07-20T08:00:00Z"
    horizon_hours: 8
    objects:
      - satno: 99002
        name: "BLUE-02"
        side: blue
        regime: LEO
        tle_line1: "1 99002U 25002A   25201.33333333  .00001000  00000-0  10000-3 0  9991"
        tle_line2: "2 99002  51.6000  45.0000 0001000   0.0000 360.0000 15.49000000 00011"
      - satno: 99003
        name: "RED-01"
        side: red
        regime: LEO
        tle_line1: "1 99003U 25003A   25201.33333333  .00002000  00000-0  20000-3 0  9991"
        tle_line2: "2 99003  51.6000  45.0500 0001200   0.0000 359.8500 15.49100000 00011"
    tool_workflow: >
      1. SPECTRE Console → Assets panel → confirm BLUE-02 (Blue) and RED-01 (Red) are pre-loaded.
      2. Intercept Engine → select BLUE-02 as Blue asset and RED-01 as Red track.
         Run a Hohmann or Lambert solver — examine the ΔV and miss distance outputs
         to confirm the relative geometry and that a threat is present.
      3. The intelligence-assessed closest approach of T+4.5 hours is stated in the briefing.
         Enter this value for Objective 2.
      4. Apply standing orders: predicted range 2.1 km is below the 5 km threshold.
         Tick Objective 3 to confirm your HEIGHTENED AWARENESS posture recommendation.
    objectives:
      - id: obj_id_aggressor
        description: "Load both objects in Assets panel and confirm RED-01 is the closing threat"
        skill_axis: situational_awareness
        points: 25
      - id: obj_estimate_tca
        description: "Enter the predicted time-to-closest-approach from the briefing intelligence (hours)"
        skill_axis: situational_awareness
        points: 40
        answer: "4.5"
        tolerance: 0.5
        unit: "hours"
      - id: obj_posture
        description: "Recommend HEIGHTENED AWARENESS posture — predicted range 2.1 km is below the 5 km threshold"
        skill_axis: decision_quality
        points: 35
    time_limit_minutes: 15
    scoring:
      passing_score: 75
      optimal_score: 100

  # ── Level 3 / Planner ────────────────────────────────────────────────────────

  - id: planner_03_multi_constraint
    title: "Evasive Manoeuvre — ΔV Budget Constraint"
    level_required: 3
    difficulty: hard
    description: >
      BLUE-02 faces a confirmed proximity threat from RED-01.  Use the Intercept
      Engine to compute evasion options across ≥2 solver methods, then select
      the solution that achieves >5 km miss distance within the 30 m/s ΔV budget.
    briefing: >
      RED-01 is on a confirmed intercept trajectory.  Intelligence TCA: T+4.5h,
      predicted range 1.2 km — below the 5 km safe threshold.  Residual ΔV budget
      for BLUE-02: 30 m/s (0.030 km/s).
      Run ≥2 Intercept Engine solver methods.  For each result examine the total ΔV
      and post-manoeuvre miss distance.  Discard any option that fails either constraint
      (miss distance < 5 km, or ΔV > 0.030 km/s).  Select the minimum-ΔV feasible option.
    scenario_epoch_utc: "2025-07-20T08:00:00Z"
    horizon_hours: 8
    objects:
      - satno: 99002
        name: "BLUE-02"
        side: blue
        regime: LEO
        tle_line1: "1 99002U 25002A   25201.33333333  .00001000  00000-0  10000-3 0  9991"
        tle_line2: "2 99002  51.6000  45.0000 0001000   0.0000 360.0000 15.49000000 00011"
      - satno: 99003
        name: "RED-01"
        side: red
        regime: LEO
        tle_line1: "1 99003U 25003A   25201.33333333  .00002000  00000-0  20000-3 0  9991"
        tle_line2: "2 99003  51.6000  45.0500 0001200   0.0000 359.8500 15.49100000 00011"
    tool_workflow: >
      1. SPECTRE Console → Assets panel → confirm BLUE-02 and RED-01 are pre-loaded.
      2. Intercept Engine → select BLUE-02 (Blue) and RED-01 (Red).
      3. Run ≥2 solver methods — at minimum try Hohmann In-Track and Lambert (or Radial).
         For each result record: total ΔV (km/s) and miss distance (intercept_range_km).
      4. Discard any result with miss distance < 5 km (constraint 1 failure).
         Discard any result with total ΔV > 0.030 km/s (constraint 2 failure).
      5. From the remaining feasible options, select the one with the lowest total ΔV.
         Tick all objectives and Submit within the time limit.
    objectives:
      - id: obj_run_engine
        description: "Run ≥2 Intercept Engine solver methods for BLUE-02 vs RED-01"
        skill_axis: manoeuvre_planning
        points: 30
      - id: obj_eliminate_infeasible
        description: "Identify and discard any solver results with miss distance < 5 km or ΔV > 0.030 km/s"
        skill_axis: decision_quality
        points: 30
      - id: obj_select_optimal
        description: "Select the minimum-ΔV feasible solution from the Intercept Engine results"
        skill_axis: decision_quality
        points: 60
      - id: obj_rationale
        description: "Confirm the selected solution satisfies both constraints: miss distance AND ΔV budget"
        skill_axis: manoeuvre_planning
        points: 40
      - id: obj_time_pressure
        description: "Submit decision within the 10-minute time limit"
        skill_axis: operational_tempo
        points: 30
    time_limit_minutes: 10
    scoring:
      passing_score: 100
      optimal_score: 190

  # ── Challenge Scenarios ───────────────────────────────────────────────────────

  - id: analyst_gauntlet
    title: "Analyst Gauntlet — Back-to-Back Sprint"
    level_required: 4
    difficulty: hard
    description: >
      Two consecutive scenarios from the Observer and Planner libraries, scored
      back-to-back.  Score above threshold on decision quality in both to pass.
    briefing: >
      You will face two threat scenarios in sequence with a combined time limit.
      Each is fully scored.  Maintain decision quality above 0.75 across both.
      No restart — advance on your decisions.
    scenario_epoch_utc: "2025-08-01T06:00:00Z"
    horizon_hours: 48
    challenge: true
    challenge_scenarios:
      - observer_02_proximity_threat
      - planner_03_multi_constraint
    objects: []
    objectives:
      - id: obj_scenario_1_pass
        description: "Complete observer_02_proximity_threat above passing threshold"
        skill_axis: decision_quality
        points: 150
      - id: obj_scenario_2_pass
        description: "Complete planner_03_multi_constraint above passing threshold"
        skill_axis: decision_quality
        points: 200
    time_limit_minutes: 45
    scoring:
      passing_score: 350
      optimal_score: 500

  - id: operator_timed_full_cycle
    title: "Full Engagement Cycle — Timed"
    level_required: 5
    difficulty: very_hard
    description: >
      Detect → assess → plan → decide → act.  A full engagement from initial cueing
      to manoeuvre execution under 20-minute time pressure.  All five skill axes scored.
    briefing: >
      RED-02 is an unknown GEO object that has drifted within 0.5° of BLUE-03's
      assigned slot.  You have initial cueing and 20 minutes to execute the full
      P&D cycle: load both objects, characterise the threat using the Intercept
      Engine (≥2 methods), evaluate options in the Decision Engine, and submit
      your decision before time expires.
    scenario_epoch_utc: "2025-09-01T12:00:00Z"
    horizon_hours: 72
    challenge: true
    objects:
      - satno: 99004
        name: "BLUE-03"
        side: blue
        regime: GEO
        tle_line1: "1 99004U 25004A   25244.50000000  .00000000  00000-0  00000-0 0  9991"
        tle_line2: "2 99004   0.0200  75.0000 0000150  90.0000   0.0000  1.00270000 00011"
      - satno: 99005
        name: "RED-02"
        side: red
        regime: GEO
        tle_line1: "1 99005U 25005A   25244.50000000  .00000050  00000-0  00000-0 0  9991"
        tle_line2: "2 99005   0.0300  75.0300 0000200  90.0000   0.0000  1.00270000 00011"
    tool_workflow: >
      Full engagement cycle — 20 minutes.
      1. DETECT: Assets panel → confirm BLUE-03 and RED-02 are pre-loaded.
         Compare RAAN values (BLUE-03: 75.0°, RED-02: 75.03°) — 0.03° separation confirms proximity.
      2. ASSESS: Intercept Engine → select BLUE-03 (Blue) and RED-02 (Red).
         Run ≥2 solver methods — examine miss distance and ΔV outputs to characterise the threat.
      3. PLAN: From the Intercept Engine results, identify ≥2 viable defensive response options.
         Note the ΔV and miss distance for each.
      4. DECIDE: Decision Engine → enter adversary actions (proximity approach, hold) and friendly
         responses (COLA manoeuvre, posture change, sensor retask, hold).  Evaluate and select.
      5. ACT: Tick all objectives and submit before 20 minutes expires.
    objectives:
      - id: obj_detect
        description: "Confirm RED-02 and BLUE-03 are loaded — note RED-02 is within 0.5° of BLUE-03"
        skill_axis: situational_awareness
        points: 60
      - id: obj_assess
        description: "Run ≥2 Intercept Engine methods — characterise the threat geometry and ΔV requirement"
        skill_axis: situational_awareness
        points: 80
      - id: obj_plan
        description: "Identify ≥2 viable defensive options from the Intercept Engine results"
        skill_axis: manoeuvre_planning
        points: 90
      - id: obj_decide
        description: "Use the Decision Engine to evaluate options and select the robust response"
        skill_axis: decision_quality
        points: 100
      - id: obj_act
        description: "Submit all decisions within the 20-minute time limit"
        skill_axis: operational_tempo
        points: 100
      - id: obj_efficiency
        description: "Selected manoeuvre ΔV is within 20% of the minimum feasible option from the Intercept Engine"
        skill_axis: efficiency
        points: 70
    time_limit_minutes: 20
    scoring:
      passing_score: 400
      optimal_score: 600

  # ── Level 2 additions ─────────────────────────────────────────────────────────

  - id: cadet_02_leo_debris_conjunction
