  - id: cadet_03_inspection_approach
    title: "Characterisation Approach — Unknown RSO"
    level_required: 2
    difficulty: easy
    description: >
      An uncharacterised Resident Space Object has been detected in a near-circular
      LEO orbit.  Use the Clohessy-Wiltshire solver in the Intercept Engine to plan
      a safe observation approach, placing BLUE-INS at a 1–3 km standoff position.
    briefing: >
      UNKNOWN-RSO transmits no ID beacon.  BLUE-INS is your inspection platform.
      You must plan BLUE-INS to a standoff position of 1–3 km in the RSO's Hill
      frame.  Use the CW solver in the Intercept Engine.  Minimum safe separation
      at all approach phases: 1 km.  A 2 km standoff provides a good balance of
      sensor resolution and safety margin.
    scenario_epoch_utc: "2025-07-15T10:30:00Z"
    horizon_hours: 12
    challenge: false
    objects:
      - satno: 99020
        name: "BLUE-INS"
        side: blue
        regime: LEO
        tle_line1: "1 99020U 25020A   25196.43750000  .00000800  00000-0  40000-4 0  9991"
        tle_line2: "2 99020  51.6000 100.0000 0002000  45.0000 315.0000 15.49000000 00011"
