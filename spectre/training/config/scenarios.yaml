    briefing: >
      DEBRIS-07 (fragmentation remnant, 2019 break-up event) is predicted to pass
      within 0.8 km of BLUE-LEO at T+14 h based on catalogue conjunction screening.
      Your task: confirm the threat data, then use the Intercept Engine to plan an
      avoidance manoeuvre that achieves >5 km post-manoeuvre miss distance.
      Select the lowest-ΔV feasible option from the Intercept Engine results.
      NOTE: The 0.8 km pre-manoeuvre conjunction distance comes from the catalogue
      screening stated in this briefing — it is not output by the Intercept Engine.
    scenario_epoch_utc: "2025-06-10T08:00:00Z"
    horizon_hours: 24
    challenge: false
    objects:
