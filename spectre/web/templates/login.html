{% extends "base.html" %}
{% block title %}SPECTRE — Operator Login{% endblock %}

{% block content %}
<div style="min-height: calc(100vh - 84px); display: flex; align-items: center; justify-content: center; padding: var(--spectre-space-6)">
  <div class="spectre-panel spectre-fade-in" style="width: 100%; max-width: 420px">

    <div style="text-align: center; margin-bottom: var(--spectre-space-6)">
      <img src="/static/spectre-theme/assets/logo-primary.svg" alt="SPECTRE"
           style="width: 200px; height: auto;" />
    </div>

    <div class="spectre-panel-header">
      <span class="spectre-panel-title">Operator Authentication</span>
      <span class="spectre-badge spectre-badge-neutral">CONSOLE ACCESS</span>
    </div>

    {% if error %}
    <div class="spectre-card spectre-card-threat" style="margin: var(--spectre-space-4) 0">
      <p style="font-size: var(--spectre-size-small); color: var(--spectre-color-threat-red)">{{ error }}</p>
    </div>
    {% endif %}

    <form method="post" action="/login"
          style="display: flex; flex-direction: column; gap: var(--spectre-space-4); margin-top: var(--spectre-space-4)">
      <div>
        <label class="spectre-label" for="username">Username</label>
        <input class="spectre-input" id="username" name="username" type="text"
               autocomplete="username" required autofocus
               placeholder="Enter operator username"
               title="Your SPECTRE operator account username" />
      </div>
      <div>
        <label class="spectre-label" for="password">Password</label>
        <input class="spectre-input" id="password" name="password" type="password"
               autocomplete="current-password" required
               placeholder="Enter password"
               title="Your SPECTRE operator account password" />
      </div>
      <button type="submit" class="spectre-btn spectre-btn-primary spectre-btn-lg"
              style="width: 100%; margin-top: var(--spectre-space-2)"
              title="Authenticate to access the SPECTRE operator console">
        Sign In
      </button>
    </form>

    <p class="spectre-caption" style="text-align: center; margin-top: var(--spectre-space-6)">
      Space Planning, Evaluation &amp; Counter-Threat Response Engine &middot; Orbital Warfare M&amp;S
    </p>
  </div>
</div>
{% endblock %}
