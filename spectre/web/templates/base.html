<!DOCTYPE html>
<html lang="en" data-theme="ops" data-spectre-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}SPECTRE{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="/static/spectre-theme/assets/icon-mark.svg" />
  <link rel="stylesheet" href="/static/spectre-theme.css" />
  <link rel="stylesheet" href="/static/spectre-theme/css/spectre-icons.css" />
  <link rel="stylesheet" href="/static/style.css" />
  <link rel="stylesheet" href="/static/themes.css" />
  <!-- Apply saved theme before first paint to prevent flash -->
  <script>(function(){var t=localStorage.getItem('spectre-theme');var valid=['ops','steel'];if(t&&valid.indexOf(t)!==-1){document.documentElement.setAttribute('data-theme',t);document.documentElement.setAttribute('data-spectre-theme',t==='steel'?'light':'dark');}else if(t){localStorage.removeItem('spectre-theme');}})();</script>
  {% if csrf_token %}<meta name="csrf-token" content="{{ csrf_token }}" />{% endif %}
  <script src="/static/htmx.min.js"></script>
  <script src="/static/chart.umd.min.js"
          onerror="this.onerror=null;this.src='https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js'"></script>
  <script src="/static/hammer.min.js"
          onerror="this.onerror=null;this.src='https://cdn.jsdelivr.net/npm/hammerjs@2.0.8/hammer.min.js'"></script>
  <script src="/static/chartjs-plugin-zoom.min.js"
          onerror="this.onerror=null;this.src='https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1/dist/chartjs-plugin-zoom.min.js'"></script>
</head>
<body{% if csrf_token %} hx-headers='{"X-CSRF-Token": "{{ csrf_token }}"}'{% endif %}>
  <div class="app-chrome">
    <div class="spectre-classification-banner unclassified">UNCLASSIFIED</div>
    <nav class="nav-bar">
      <div class="nav-brand">
        {% block nav_brand %}
        <img class="nav-logo" src="/static/spectre-theme/assets/logo-horizontal.svg" alt="SPECTRE" />
        {% endblock %}
      </div>
      {% block nav_actions %}{% endblock %}
    </nav>
  </div>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
