{% if error %}
<div class="error-msg" role="alert">{{ error }}</div>
{% endif %}
{% if blue_assets %}
<ul class="asset-list">
  {% for asset in blue_assets %}
  <li class="asset-item">
    <span class="asset-name">{{ asset.stk_name }}</span>
    <button class="btn-remove"
            hx-delete="/assets/blue/{{ asset.name }}"
            hx-target="#blue-list"
            hx-swap="innerHTML"
            hx-confirm="Remove {{ asset.stk_name }}?"
            title="Remove {{ asset.stk_name }} from the session">&times;</button>
  </li>
  {% endfor %}
</ul>
{% else %}
<p class="empty-msg">No blue assets defined.</p>
{% endif %}
