{% if error %}
<div class="udl-state udl-error">
  <span class="udl-label">UDL &#9888; {{ error }}</span>
  <details class="udl-login-wrap" open>
    <summary class="btn-secondary btn-sm">Retry</summary>
    <form hx-post="/udl/login"
          hx-target="#udl-status"
          hx-swap="innerHTML"
          class="udl-login-form">
      <input name="username" placeholder="UDL Username" required autocomplete="off"
             title="Your UDL account username" />
      <input name="password" type="password" placeholder="UDL Password" required autocomplete="off"
             title="Your UDL account password — stored in memory only, never written to disk" />
      <div class="submit-row">
        <button type="submit" class="btn-primary btn-sm"
                hx-disabled-elt="this"
                title="Authenticate with UDL to enable TLE fetch and HRR watchlist">Connect</button>
        <span class="htmx-indicator"><span class="spinner"></span>Connecting&hellip;</span>
      </div>
    </form>
  </details>
</div>
<script>
(function(){
  var d = document.getElementById('udl-dropdown');
  if (!d) return;
  var dot = d.querySelector('.chip-dot');
  if (dot) dot.className = 'chip-dot dot-amber';
  var lbl = d.querySelector('.chip-label');
  if (lbl) lbl.textContent = 'UDL \u26a0';
})();
</script>
{% elif udl_user %}
<div class="udl-state udl-connected">
  <span class="udl-label">UDL &#10003; Connected as <strong>{{ udl_user }}</strong></span>
  <button class="btn-secondary btn-sm"
          hx-post="/udl/logout"
          hx-target="#udl-status"
          hx-swap="innerHTML"
          title="End the UDL session — credentials are cleared from memory">Disconnect</button>
</div>
{# OOB: replace the TLE Source panel with the live dropdown #}
<div id="tle-source-panel" hx-swap-oob="innerHTML">
  {% include "partials/tle_source_panel.html" %}
</div>
<script>
(function(){
  var d = document.getElementById('udl-dropdown');
  if (!d) return;
  d.removeAttribute('open');
  var dot = d.querySelector('.chip-dot');
  if (dot) dot.className = 'chip-dot dot-green';
  var lbl = d.querySelector('.chip-label');
  if (lbl) lbl.textContent = 'UDL \u2713';
})();
</script>
{% else %}
<div class="udl-state udl-disconnected">
  <span class="udl-label">UDL &mdash; Not connected</span>
  <details class="udl-login-wrap">
    <summary class="btn-secondary btn-sm">Connect</summary>
    <form hx-post="/udl/login"
          hx-target="#udl-status"
          hx-swap="innerHTML"
          class="udl-login-form">
      <input name="username" placeholder="UDL Username" required autocomplete="off"
             title="Your UDL account username" />
      <input name="password" type="password" placeholder="UDL Password" required autocomplete="off"
             title="Your UDL account password — stored in memory only, never written to disk" />
      <div class="submit-row">
        <button type="submit" class="btn-primary btn-sm"
                hx-disabled-elt="this"
                title="Authenticate with UDL to enable TLE fetch and HRR watchlist">Connect</button>
        <span class="htmx-indicator"><span class="spinner"></span>Connecting&hellip;</span>
      </div>
    </form>
  </details>
</div>
<script>
(function(){
  var d = document.getElementById('udl-dropdown');
  if (!d) return;
  var dot = d.querySelector('.chip-dot');
  if (dot) dot.className = 'chip-dot dot-grey';
  var lbl = d.querySelector('.chip-label');
  if (lbl) lbl.textContent = 'UDL';
})();
</script>
{% endif %}
