<!-- SPECTRE Splash Screen Overlay
     Shown once per session on operator console load.
     Auto-dismissed after 3.2 s or on click/keypress.
     Stored in sessionStorage so it only fires once per browser session. -->
<div id="spectre-splash"
     onclick="spectreCloseSplash()"
     style="position:fixed;inset:0;z-index:9999;background:#0A0C10;
            display:flex;flex-direction:column;align-items:center;justify-content:center;
            cursor:pointer;transition:opacity 0.6s ease;">

  <style>
    @keyframes sp-spin    { to { transform: rotate(360deg);  } }
    @keyframes sp-spin-r  { to { transform: rotate(-360deg); } }
    @keyframes sp-pulse   { 0%,100%{opacity:.9;} 50%{opacity:.45;} }
    @keyframes sp-fadein  { from{opacity:0;transform:translateY(10px);} to{opacity:1;transform:translateY(0);} }
    @keyframes sp-scan    { from{transform:translateY(-4px);} to{transform:translateY(100vh);} }
    @keyframes sp-flicker { 0%,89%,91%,94%,96%,100%{opacity:1;} 90%{opacity:.3;} 95%{opacity:.6;} }

    .sp-orbit   { animation: sp-spin   25s linear infinite; transform-origin: 140px 140px; }
    .sp-orbit-r { animation: sp-spin-r 18s linear infinite; transform-origin: 140px 140px; }
    .sp-core    { animation: sp-pulse   3s ease-in-out infinite; }
    .sp-t1 { animation: sp-fadein 1.2s ease-out 0.3s both; }
    .sp-t2 { animation: sp-fadein 1.2s ease-out 0.8s both; }
    .sp-t3 { animation: sp-fadein 1.2s ease-out 1.4s both; }
    .sp-t4 { animation: sp-fadein 1.2s ease-out 2.0s both; }
    .sp-flicker { animation: sp-flicker 8s linear infinite; }
    .sp-scan    { position:absolute; top:0; left:0; right:0; height:2px;
                  background:linear-gradient(90deg,transparent,rgba(226,75,74,.18),transparent);
                  animation: sp-scan 4s linear infinite; pointer-events:none; }
    .sp-dismiss { position:absolute; bottom:22px; left:50%; transform:translateX(-50%);
                  font-family:var(--spectre-font-mono,'JetBrains Mono',monospace);
                  font-size:9px; letter-spacing:2px; color:#374151;
                  animation: sp-fadein 1s ease-out 2.8s both; }
  </style>

  <div class="sp-scan"></div>

  <!-- Orbital animation -->
  <svg width="220" height="220" viewBox="0 0 280 280" style="margin-bottom:20px;">
    <g>
      <g class="sp-orbit" style="opacity:.14;">
        <circle cx="140" cy="140" r="120" fill="none" stroke="#E24B4A" stroke-width=".5" stroke-dasharray="4 8"/>
      </g>
      <g class="sp-orbit-r" style="opacity:.09;">
        <circle cx="140" cy="140" r="100" fill="none" stroke="#7a8ba6" stroke-width=".5" stroke-dasharray="2 6"/>
      </g>
      <ellipse cx="140" cy="140" rx="72" ry="36" fill="none" stroke="#7a8ba6" stroke-width="1.2" opacity=".55"/>
      <g class="sp-orbit">
        <ellipse cx="140" cy="140" rx="68" ry="19" fill="none" stroke="#E24B4A" stroke-width="1.4" opacity=".65" transform="rotate(35 140 140)"/>
      </g>
      <g class="sp-orbit-r">
        <ellipse cx="140" cy="140" rx="68" ry="19" fill="none" stroke="#E24B4A" stroke-width="1.4" opacity=".65" transform="rotate(-35 140 140)"/>
      </g>
      <g class="sp-core">
        <rect x="131" y="131" width="18" height="18" fill="#E24B4A" transform="rotate(45 140 140)"/>
        <rect x="136" y="136" width="8"  height="8"  fill="#c8cdd5" transform="rotate(45 140 140)"/>
      </g>
      <g class="sp-orbit">
        <circle cx="200" cy="112" r="2.5" fill="#E24B4A" opacity=".8"/>
      </g>
      <g class="sp-orbit-r">
        <circle cx="90"  cy="175" r="1.8" fill="#7a8ba6" opacity=".5"/>
      </g>
      <!-- Crosshair ticks -->
      <line x1="50"  y1="140" x2="62"  y2="140" stroke="#7a8ba6" stroke-width=".5" opacity=".3"/>
      <line x1="218" y1="140" x2="230" y2="140" stroke="#7a8ba6" stroke-width=".5" opacity=".3"/>
      <line x1="140" y1="90"  x2="140" y2="98"  stroke="#7a8ba6" stroke-width=".5" opacity=".3"/>
      <line x1="140" y1="182" x2="140" y2="190" stroke="#7a8ba6" stroke-width=".5" opacity=".3"/>
    </g>
  </svg>

  <!-- Wordmark -->
  <div class="sp-t1 sp-flicker"
       style="font-family:var(--spectre-font-mono,'JetBrains Mono',monospace);
              font-size:38px;font-weight:700;letter-spacing:16px;color:#D0D4DC;margin-bottom:8px;">
    SPECTRE
  </div>

  <!-- Full title -->
  <div class="sp-t2"
       style="font-family:var(--spectre-font-mono,'JetBrains Mono',monospace);
              font-size:9.5px;letter-spacing:3.5px;color:#6B7280;margin-bottom:28px;text-align:center;
              max-width:480px;line-height:1.6;">
    SPACE PLANNING, EVALUATION &amp; COUNTER-THREAT RESPONSE ENGINE
  </div>

  <!-- Meta row -->
  <div class="sp-t3" style="display:flex;gap:20px;align-items:center;margin-bottom:18px;">
    <span style="font-family:var(--spectre-font-mono,'JetBrains Mono',monospace);font-size:9px;color:#374151;letter-spacing:2px;">v2.0.0</span>
    <span style="width:3px;height:3px;background:#E24B4A;border-radius:50%;display:inline-block;"></span>
    <span style="font-family:var(--spectre-font-mono,'JetBrains Mono',monospace);font-size:9px;color:#374151;letter-spacing:2px;">UNCLASSIFIED</span>
    <span style="width:3px;height:3px;background:#E24B4A;border-radius:50%;display:inline-block;"></span>
    <span style="font-family:var(--spectre-font-mono,'JetBrains Mono',monospace);font-size:9px;color:#374151;letter-spacing:2px;">PROTECT &amp; DEFEND</span>
  </div>

  <!-- Init line -->
  <div class="sp-t4"
       style="font-family:var(--spectre-font-mono,'JetBrains Mono',monospace);
              font-size:9px;color:#4B5563;letter-spacing:1.5px;">
    INITIALISING ORBITAL AWARENESS...
  </div>

  <!-- Corner markers -->
  <div style="position:absolute;top:18px;left:22px;font-family:var(--spectre-font-mono,'JetBrains Mono',monospace);font-size:8px;color:#1F2937;letter-spacing:1px;">SPECTRE//OPS</div>
  <div style="position:absolute;top:18px;right:22px;font-family:var(--spectre-font-mono,'JetBrains Mono',monospace);font-size:8px;color:#1F2937;letter-spacing:1px;">SYS.OK</div>
  <div class="sp-dismiss">CLICK TO ENTER — OR WAIT</div>
</div>

<script>
(function () {
  var key = 'spectre-splash-seen';
  var el  = document.getElementById('spectre-splash');
  if (!el) return;

  // Skip if already seen this session
  if (sessionStorage.getItem(key)) { el.remove(); return; }

  // Auto-dismiss after 3.4 s
  var timer = setTimeout(spectreCloseSplash, 3400);

  // Also dismiss on any keypress
  document.addEventListener('keydown', spectreCloseSplash, { once: true });

  function spectreCloseSplash() {
    clearTimeout(timer);
    document.removeEventListener('keydown', spectreCloseSplash);
    sessionStorage.setItem(key, '1');
    el.style.opacity = '0';
    el.style.pointerEvents = 'none';
    setTimeout(function () { el.remove(); }, 650);
  }
  // expose for onclick
  window.spectreCloseSplash = spectreCloseSplash;
})();
</script>
