<tr id="user-row-{{ u.id }}"
    style="border-bottom:1px solid var(--spectre-color-border)">
  <td style="padding:var(--spectre-space-3) var(--spectre-space-4)">
    <span style="font-weight:500">{{ u.username }}</span>
    {% if u.id == current_user.id %}
    <span class="spectre-badge spectre-badge-neutral" style="margin-left:var(--spectre-space-2)">you</span>
    {% endif %}
  </td>
  <td style="padding:var(--spectre-space-3) var(--spectre-space-4)">
    {% if u.role == "admin" %}
    <span class="spectre-badge" style="background:var(--spectre-color-accent); color:var(--spectre-color-bg)">admin</span>
    {% else %}
    <span class="spectre-badge spectre-badge-neutral">operator</span>
    {% endif %}
  </td>
  <td style="padding:var(--spectre-space-3) var(--spectre-space-4);
             color:var(--spectre-color-text-muted); font-size:var(--spectre-size-xsmall)">
    {{ u.created_at.strftime("%Y-%m-%d %H:%M") }}
  </td>
  <td style="padding:var(--spectre-space-3) var(--spectre-space-4); text-align:right">
    <button class="spectre-btn spectre-btn-ghost"
            style="font-size:var(--spectre-size-xsmall)"
            hx-get="/admin/users/{{ u.id }}/edit"
            hx-target="#user-row-{{ u.id }}"
            hx-swap="outerHTML"
            title="Edit role or reset password for {{ u.username }}">
      Edit
    </button>
    {% if u.id != current_user.id %}
    <button class="spectre-btn spectre-btn-ghost"
            style="font-size:var(--spectre-size-xsmall); color:var(--spectre-color-threat-red)"
            hx-delete="/admin/users/{{ u.id }}"
            hx-target="#user-table-region"
            hx-swap="innerHTML"
            hx-confirm="Delete user '{{ u.username }}'? This cannot be undone."
            title="Permanently delete {{ u.username }}">
      Delete
    </button>
    {% endif %}
  </td>
</tr>
