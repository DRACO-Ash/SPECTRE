<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" fill="#000D1A"/>
  <!-- Accent bar at top -->
  <rect x="0" y="0" width="30" height="3" fill="#002244"/>
  <rect x="30" y="0" width="20" height="3" fill="#004990"/>
  <rect x="50" y="0" width="20" height="3" fill="#00659E"/>
  <rect x="70" y="0" width="30" height="3" fill="#C8A415"/>
  <!-- Outer ring -->
  <circle cx="50" cy="52" r="44" fill="none" stroke="#004990" stroke-width="1.5" opacity="0.6"/>
  <!-- Earth -->
  <circle cx="50" cy="52" r="13" fill="#002244" stroke="#00659E" stroke-width="1.2"/>
  <!-- Orbit A (target) -->
  <ellipse cx="50" cy="52" rx="34" ry="20" fill="none" stroke="#00659E" stroke-width="1.5"
           stroke-dasharray="4 2" opacity="0.6" transform="rotate(-20 50 52)"/>
  <!-- Orbit B (interceptor) -->
  <ellipse cx="50" cy="52" rx="27" ry="14" fill="none" stroke="#004990" stroke-width="1"
           stroke-dasharray="3 3" opacity="0.4" transform="rotate(35 50 52)"/>
  <!-- Target satellite (blue) -->
  <rect x="65" y="24" width="7" height="5" fill="#00659E" rx="0.5" opacity="0.9"/>
  <!-- Interceptor (gold) -->
  <rect x="27" y="73" width="7" height="5" fill="#C8A415" rx="0.5" opacity="0.9"/>
  <!-- Intercept vector (gold) -->
  <line x1="33" y1="75" x2="67" y2="30" stroke="#C8A415" stroke-width="1.5"
        stroke-dasharray="4 2" opacity="0.8"/>
  <!-- Reticle cardinal ticks -->
  <g stroke="#00659E" stroke-width="1" opacity="0.45">
    <line x1="50" y1="6"  x2="50" y2="12"/>
    <line x1="50" y1="92" x2="50" y2="98"/>
    <line x1="4"  y1="52" x2="10" y2="52"/>
    <line x1="90" y1="52" x2="96" y2="52"/>
  </g>
  <!-- Emblem border -->
  <circle cx="50" cy="52" r="44" fill="none" stroke="#004990" stroke-width="1" opacity="0.4"/>
</svg>
