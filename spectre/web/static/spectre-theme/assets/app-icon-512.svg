<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!--
    SPECTRE App Icon
    Usage: Desktop shortcut, taskbar, mobile home screen
    Dark background baked in — use as-is
  -->

  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="#0A0C10"/>

  <!-- Orbital eye mark, centred -->
  <g transform="translate(256, 256)">
    <!-- Tracking ellipses -->
    <ellipse cx="0" cy="0" rx="150" ry="75" fill="none" stroke="#D0D4DC" stroke-width="4" opacity="0.85"/>
    <ellipse cx="0" cy="0" rx="112" ry="54" fill="none" stroke="#D0D4DC" stroke-width="2" opacity="0.4"/>

    <!-- Threat cross-track arcs -->
    <g transform="rotate(35)">
      <ellipse cx="0" cy="0" rx="144" ry="40" fill="none" stroke="#E24B4A" stroke-width="3.5" opacity="0.85"/>
    </g>
    <g transform="rotate(-35)">
      <ellipse cx="0" cy="0" rx="144" ry="40" fill="none" stroke="#E24B4A" stroke-width="3.5" opacity="0.85"/>
    </g>

    <!-- Focal diamond -->
    <g transform="rotate(45)">
      <rect x="-18" y="-18" width="36" height="36" fill="#E24B4A" opacity="0.95"/>
    </g>
    <g transform="rotate(45)">
      <rect x="-9" y="-9" width="18" height="18" fill="#D0D4DC" opacity="0.9"/>
    </g>

    <!-- Tracking dots -->
    <circle cx="-108" cy="-50" r="5" fill="#E24B4A" opacity="0.7"/>
    <circle cx="86" cy="60" r="4" fill="#D0D4DC" opacity="0.35"/>
    <circle cx="130" cy="-22" r="3" fill="#D0D4DC" opacity="0.25"/>
  </g>
</svg>
