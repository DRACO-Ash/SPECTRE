<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <!--
    SPECTRE Icon Mark
    Usage: Favicon, app icon (place on rounded-rect background), watermark
    Works at 16px minimum
  -->
  <g transform="translate(64, 64)">
    <!-- Tracking ellipse -->
    <ellipse cx="0" cy="0" rx="42" ry="21" fill="none" stroke="currentColor" stroke-width="2.5" opacity="0.85"/>

    <!-- Threat cross-track arcs -->
    <g transform="rotate(35)">
      <ellipse cx="0" cy="0" rx="40" ry="11" fill="none" stroke="#E24B4A" stroke-width="2" opacity="0.85"/>
    </g>
    <g transform="rotate(-35)">
      <ellipse cx="0" cy="0" rx="40" ry="11" fill="none" stroke="#E24B4A" stroke-width="2" opacity="0.85"/>
    </g>

    <!-- Focal diamond -->
    <g transform="rotate(45)">
      <rect x="-6" y="-6" width="12" height="12" fill="#E24B4A" opacity="0.95"/>
    </g>
    <g transform="rotate(45)">
      <rect x="-3" y="-3" width="6" height="6" fill="currentColor" opacity="0.9"/>
    </g>
  </g>
</svg>
