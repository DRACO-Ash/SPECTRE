<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 48" fill="none">
  <!--
    SPECTRE Horizontal Logo
    Usage: Navigation bars, toolbar headers, inline branding
    Min width: 160px
  -->

  <!-- Compact orbital eye mark -->
  <g transform="translate(24, 24)">
    <ellipse cx="0" cy="0" rx="16" ry="9" fill="none" stroke="currentColor" stroke-width="1.6" opacity="0.9"/>
    <g transform="rotate(35)">
      <ellipse cx="0" cy="0" rx="15" ry="4.5" fill="none" stroke="#E24B4A" stroke-width="1.2" opacity="0.85"/>
    </g>
    <g transform="rotate(-35)">
      <ellipse cx="0" cy="0" rx="15" ry="4.5" fill="none" stroke="#E24B4A" stroke-width="1.2" opacity="0.85"/>
    </g>
    <g transform="rotate(45)">
      <rect x="-3" y="-3" width="6" height="6" fill="#E24B4A" opacity="0.95"/>
    </g>
    <g transform="rotate(45)">
      <rect x="-1.5" y="-1.5" width="3" height="3" fill="currentColor" opacity="0.9"/>
    </g>
  </g>

  <!-- Wordmark -->
  <text x="54" y="29" text-anchor="start"
        font-family="'JetBrains Mono', 'Fira Code', 'Cascadia Code', 'Consolas', monospace"
        font-size="22" font-weight="500" letter-spacing="8" fill="currentColor">
    SPECTRE
  </text>
</svg>
