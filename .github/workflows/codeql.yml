name: CodeQL

# Code scanning for the master ruleset, which requires CodeQL results before a
# pull request can merge (no high or higher security alert, no error alert).
# Owner request, 26 October 2026.
#
# Python only, over spectre/, tle_clustering/ and scripts/. The application's
# own JavaScript is inline in the Jinja templates, which CodeQL does not
# extract; the files under spectre/web/static are vendored third-party builds,
# listed in vendored.json and scanned against OSV by the SCA job in ci.yml.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    # Weekly, so new queries run against code that has not changed.
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  analyse:
    name: CodeQL (python)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Initialise CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: python
          build-mode: none
          queries: security-extended
          # The application and its scripts. audit/ holds the audit's own
          # probe scripts and tests/ holds fixture credentials by design;
          # neither ships, and both would only add noise to the gate.
          config: |
            paths:
              - spectre
              - tle_clustering
              - scripts
      - name: Analyse
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:python"
