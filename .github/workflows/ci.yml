name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint + Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        # pywin32 is Windows-only; skip on Ubuntu CI runner
        run: pip install -e ".[dev]" --no-deps || pip install fastapi uvicorn[standard] jinja2 python-multipart "sqlalchemy[asyncio]" aiosqlite "passlib[bcrypt]" itsdangerous structlog pytest pytest-asyncio "anyio[trio]" httpx pytest-cov mypy ruff && pip install -e . --no-deps

      - name: Lint with ruff
        run: ruff check .

      - name: Run unit tests with coverage
        run: pytest tests/unit/ --cov=sipc --cov-report=term-missing --cov-fail-under=70
