name: CI

# Aligned to docs/SECURITY.md — UK NCSC Secure Development Guidance / SSCoP
# Third-party Actions are managed by Dependabot (.github/dependabot.yml).

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Minimal default permissions — individual jobs escalate only what they need.
permissions:
  contents: read

jobs:

  # ── Lint + type-check ───────────────────────────────────────────────────────
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install linting tools
        run: pip install ruff mypy types-PyYAML sqlalchemy[mypy] fastapi
      - name: ruff — style and import checks
        run: ruff check spectre/ tests/
      - name: mypy — strict type checking
        run: mypy spectre/ --ignore-missing-imports

  # ── Unit + integration tests ─────────────────────────────────────────────────
  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run tests with coverage
        run: pytest tests/ -q --cov=spectre --cov-report=term-missing --cov-fail-under=70

  # ── SAST — bandit ────────────────────────────────────────────────────────────
  sast:
    name: SAST (bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install bandit
        run: pip install "bandit[toml]"
      - name: bandit — medium+ severity gate
        # -ll = medium severity and above; fails CI on any medium/high finding.
        run: bandit -r spectre/ -ll -c pyproject.toml -q

  # ── SCA — dependency vulnerability audit ─────────────────────────────────────
  sca:
    name: SCA (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies and pip-audit
        run: |
          pip install fastapi "uvicorn[standard]" jinja2 python-multipart \
            "sqlalchemy[asyncio]" aiosqlite "bcrypt>=4.0" itsdangerous \
            structlog sgp4 numpy scipy httpx python-dotenv pip-audit
      - name: pip-audit — dependency vulnerability scan
        run: pip-audit --desc on

  # ── Secret detection ──────────────────────────────────────────────────────────
  secrets:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL \
            https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks
      - name: gitleaks — scan repository history for secrets
        run: gitleaks detect --source . --redact -v
