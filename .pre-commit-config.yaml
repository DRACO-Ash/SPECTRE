# Pre-commit hooks — aligned to docs/SECURITY.md
# Install: pip install pre-commit && pre-commit install

repos:
  # Secret detection — must run first to prevent credentials entering VCS
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks

  # Ruff, Bandit and Mypy run from the environment, so the hook versions are
  # the hash-locked ones in requirements-dev.txt. Pinned hook repos sat at
  # ruff 0.9.0, bandit 1.7.10 and mypy 1.14.0 against locks of 0.16.5, 1.9.4
  # and 2.3.1, so a commit passed hooks that CI then failed (audit F-279).
  # Install the dev set first: pip install --require-hashes -r requirements-dev.txt
  - repo: local
    hooks:
      - id: ruff
        name: ruff (locked version)
        entry: ruff check --fix
        language: system
        types: [python]
        # The Backlog Brain pack is vendored as shipped, like the static JS.
        exclude: ^\.claude/skills/
      - id: bandit
        name: bandit (locked version)
        entry: bandit -c pyproject.toml -ll
        language: system
        types: [python]
        exclude: ^(tests/|\.claude/skills/)
      - id: mypy
        name: mypy (locked version, as CI runs it)
        entry: mypy spectre/ --ignore-missing-imports
        language: system
        types: [python]
        pass_filenames: false

  # General hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: no-commit-to-branch
        args: [--branch, master]
